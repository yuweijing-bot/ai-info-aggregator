name: Daily AI Digest

on:
  schedule:
    - cron: "0 23 * * *"  # 每天 UTC 23:00 = 北京时间次日 07:00（落在 DeepSeek 夜间半价时段 00:30-08:30 内）
  workflow_dispatch:       # 支持手动触发

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允许提交文件到仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LOOKBACK_DAYS: "1"
        run: python main.py
      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended

      - name: Convert Markdown to DOCX and PDF
        run: |
          latest=$(ls -t output/*.md | head -n 1)
          pandoc "$latest" -o "${latest%.md}.docx"
          pandoc "$latest" -o "${latest%.md}.pdf" --pdf-engine=xelatex
      - name: Email Daily Digest
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_USER }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from pathlib import Path
          from email.message import EmailMessage

          output_dir = Path("output")
          latest_md = max(output_dir.glob("*.md"), key=lambda p: p.stat().st_mtime)
          latest_docx = latest_md.with_suffix(".docx")
          latest_pdf = latest_md.with_suffix(".pdf")

          subject = f"AI Daily Digest - {latest_md.stem.replace('AI Daily - ', '')}"

          body = latest_md.read_text(encoding="utf-8")

          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = os.environ["EMAIL_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(body)
 
          html_body = f"""
          <html>
            <body style="font-family: Arial, sans-serif; line-height:1.6;">
             <pre style="white-space: pre-wrap;">{body}</pre>
            </body>
          </html>
          """

          msg.add_alternative(html_body, subtype="html")
          

          for file_path in [latest_md, latest_docx, latest_pdf]:
              if file_path.exists():
                  msg.add_attachment(
                      file_path.read_bytes(),
                      maintype="application",
                      subtype="octet-stream",
                      filename=file_path.name,
                  )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(os.environ["EMAIL_USER"], os.environ["EMAIL_PASS"])
              smtp.send_message(msg)

          print(f"Sent email with {latest_md.name}")
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git stash push --include-untracked || true
          git pull --rebase origin main
          git stash pop || true

          git add output/ data/
          git diff --cached --quiet || git commit -m "daily digest $(date -u +%Y-%m-%d)"
          git push
